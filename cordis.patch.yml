# Turtle UI's dsh profile bundle patch (declared by the `dsh.bundle.patch`
# manifest field): applied over the dsh-base layer when this package appears
# in a profile's `dsh.profile.bundles` list. Overrides base rows by id and
# inserts the TUI front door plus its context rows.
#
# Since 0.2.0 the terminal surface keeps the base's host-plane composition:
# the agent's tools, prompt sections, and delegation backends stay mounted
# process-wide (the base explicitly keeps them "for the TUI"), so this patch
# mounts neither the agent-preset registry nor preset declarations — those are
# the Web surface's per-session plane. The durable storage stack
# (storage/storage-json/storage-domain) and session-projection-cache likewise
# ship in dsh-base now, so they no longer need inserting here.

# The ordinary tui-startup provider injects cmdlineArgs, owns --resume,
# --session, and this app's --help, then provides tuiStartup. Session-bound
# rows inject that service, so Loader resolves these expressions only after the
# provider has parsed the invocation.
- id: agent-loop
  inject: [tuiStartup]
  config:
    agents:
      - id: main
        sessionId: !!js ctx.tuiStartup.sessionId
        resumeSessionId: !!js ctx.tuiStartup.resumeSessionId
        provider: deepseek-official
        model: deepseek-v4-pro
        cwd: !!js process.cwd()

- id: system-prompt
  config:
    # `persona` was split into personaPrefix/personaSuffix in 0.2.0.
    personaPrefix: |
      You are a coding agent powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    thinking: enabled
    reasoningEffort: max

- id: fs-sandbox
  config:
    cwd: !!js process.cwd()

- id: tools
  config:
    mode: native

- insert:
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    # Durable workspace records and the registry-global archive set. The resume
    # selector reads the archive set to hide removed sessions and writes it from
    # the picker's Ctrl+D — the delete-without-data-loss path — while the Web
    # surface mounts this same registry for its sidebar. It needs only base rows
    # (storage/storage-json/storage-domain, session persistence), and the TUI
    # reads it optionally, so removing this row degrades to no archived scope.
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: tmux-context
      name: '@deepseek-ai/dsh-tmux-context'
      config:
        refreshIntervalMs: 900000

    - id: tui-prompt
      name: '@deepseek-ai/dsh-tui/prompt'

    - id: tui-startup
      name: '@deepseek-ai/dsh-tui/startup'

    - id: tui
      name: '@deepseek-ai/dsh-tui'
      inject: [tuiStartup]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId ?? ctx.tuiStartup.resumeSessionId
        showReasoning: true
        maxToolOutputLines: 6
        # `rich` parses transcript prose as Markdown; `plain` keeps it verbatim.
        # Switchable at runtime with /render.
        renderMode: rich
        # Interface language. `auto` follows LC_ALL/LC_MESSAGES/LANG; `en` and
        # `zh` pin one. Switchable at runtime with /locale.
        locale: auto
        # Retained prompts offered by the Ctrl+R search, newest first.
        historySize: 200
        # Optional price table for `/cost`. `input` and `output` are required;
        # any other field left out (or set to `*`) matches any route, so a row
        # may also act as a catch-all fallback. Prices are per million tokens in
        # the currency below; they are deployment configuration, not figures
        # reported by a provider.
        currency: '$'
        prices: []
        # prices:
        #   - provider: deepseek-official
        #     model: deepseek-v4-pro
        #     input: 0.55
        #     output: 2.19
        #     cacheRead: 0.07
        #   - model: '*'
        #     input: 0.27
        #     output: 1.10

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
