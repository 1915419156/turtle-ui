# Turtle UI's dsh profile bundle patch (declared by the `dsh.bundle.patch`
# manifest field): applied over the dsh-base layer when this package appears
# in a profile's `dsh.profile.bundles` list. Overrides base rows by id and inserts the
# TUI front door plus its projection/storage support rows.

# The ordinary tui-startup provider injects cmdlineArgs, owns --resume,
# --session, and this app's --help, then provides tuiStartup. Session-bound
# rows inject that service, so Loader resolves these expressions only after the
# provider has parsed the invocation.
- id: agent-loop
  inject: [tuiStartup]
  config:
    agents:
      - id: main
        sessionId: !!js ctx.tuiStartup.sessionId
        resumeSessionId: !!js ctx.tuiStartup.resumeSessionId
        provider: deepseek-official
        model: deepseek-v4-pro
        cwd: !!js process.cwd()

- id: system-prompt
  config:
    persona: |
      You are a coding agent powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    thinking: enabled
    reasoningEffort: max

- id: fs-sandbox
  config:
    cwd: !!js process.cwd()

- id: tools
  config:
    mode: native

- insert:
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: tmux-context
      name: '@deepseek-ai/dsh-tmux-context'
      config:
        refreshIntervalMs: 900000

    - id: tui-prompt
      name: '@deepseek-ai/dsh-tui/prompt'

    - id: tui-startup
      name: '@deepseek-ai/dsh-tui/startup'

    - id: tui
      name: '@deepseek-ai/dsh-tui'
      inject: [tuiStartup]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId ?? ctx.tuiStartup.resumeSessionId
        showReasoning: true
        maxToolOutputLines: 6

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
